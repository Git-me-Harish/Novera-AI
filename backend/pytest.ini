[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra
# test_chat.py, test_retrieval.py and test_document_upload.py are manual
# scripts that drive a running server over HTTP; they are not unit tests.
norecursedirs = .pytest_cache logs data
filterwarnings =
    ignore::DeprecationWarning
